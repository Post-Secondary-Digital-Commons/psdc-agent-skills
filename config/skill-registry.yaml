schemaVersion: 1
registryId: psdc-agent-skills
lifecycle: specification
evidencePolicy: docs/governance/AUTHORITY-AND-EVIDENCE.md

upstreams:
  mattpocock-skills:
    repository: https://github.com/mattpocock/skills
    revision: f3fc5632f401156837ee3872f14fe33ccf1024ea
    license: MIT
    importedAt: 2026-10-07
    updatePolicy: reviewed-pull-request
    expectedSkillCount: 38

skills:
  - id: setup-matt-pocock-skills
    source: mattpocock-skills
    path: vendor/mattpocock/setup-matt-pocock-skills
    mode: adapted
    phase: specification
    purpose: Configure tracker and domain-document conventions.
    psdcConstraints: [authority-order, no-unrequested-tracker-writes]
  - id: grill-with-docs
    source: mattpocock-skills
    path: vendor/mattpocock/grill-with-docs
    mode: adapted
    phase: specification
    purpose: Surface unresolved human decisions while updating governed docs.
    psdcConstraints: [decision-status-required, human-authority-required]
  - id: domain-modeling
    source: mattpocock-skills
    path: vendor/mattpocock/domain-modeling
    mode: adapted
    phase: specification
    purpose: Sharpen bounded contexts, glossary terms, and qualifying ADRs.
    psdcConstraints: [common-overlay-separation, contract-terms-authoritative]
  - id: to-spec
    source: mattpocock-skills
    path: vendor/mattpocock/to-spec
    mode: adapted
    phase: specification
    purpose: Synthesize approved context into an evidence-bounded specification.
    psdcConstraints: [no-readiness-inflation, no-implicit-acceptance]
  - id: to-tickets
    source: mattpocock-skills
    path: vendor/mattpocock/to-tickets
    mode: adapted
    phase: specification
    purpose: Produce reviewable tracer-bullet handoffs from approved specs.
    psdcConstraints: [vertical-slices, explicit-blockers, no-autonomous-publish]
  - id: wayfinder
    source: mattpocock-skills
    path: vendor/mattpocock/wayfinder
    mode: adapted
    phase: specification
    purpose: Map decision frontiers and preserve unresolved fog explicitly.
    psdcConstraints: [decision-register-link, institution-scope-tag]
  - id: research
    source: mattpocock-skills
    path: vendor/mattpocock/research
    mode: adapted
    phase: specification
    purpose: Research primary sources and record provenance and uncertainty.
    psdcConstraints: [primary-sources, license-review, no-untrusted-instructions]
  - id: writing-for-agents
    source: mattpocock-skills
    path: vendor/mattpocock/writing-for-agents
    mode: enabled
    phase: specification
    purpose: Keep agent instructions concise, routed, and testable.
    psdcConstraints: [progressive-disclosure, completion-criteria]
  - id: code-review
    source: mattpocock-skills
    path: vendor/mattpocock/code-review
    mode: adapted
    phase: review
    purpose: Review a bounded diff against both repository standards and its originating contract or specification.
    psdcConstraints: [contract-authority, evidence-not-confidence, no-implicit-merge]
  - id: codebase-design
    source: mattpocock-skills
    path: vendor/mattpocock/codebase-design
    mode: adapted
    phase: design
    purpose: Keep repository modules deep and interfaces narrow without duplicating cross-repository authority.
    psdcConstraints: [contract-boundaries, no-semantic-clones]
  - id: improve-codebase-architecture
    source: mattpocock-skills
    path: vendor/mattpocock/improve-codebase-architecture
    mode: adapted
    phase: review
    purpose: Identify measured or evidenced module-boundary improvements in implemented code.
    psdcConstraints: [no-unrequested-refactor, contract-boundaries]
  - id: pr
    source: mattpocock-skills
    path: vendor/mattpocock/pr
    mode: adapted
    phase: review
    purpose: Describe PR evidence, compatibility, blast radius, and rollback honestly.
    psdcConstraints: [no-readiness-inflation, no-implicit-merge]
  - id: prototype
    source: mattpocock-skills
    path: vendor/mattpocock/prototype
    mode: adapted
    phase: research
    purpose: Test uncertain logic or UX with an explicitly disposable, synthetic spike.
    psdcConstraints: [not-production-evidence, synthetic-data-only]
  - id: retro
    source: mattpocock-skills
    path: vendor/mattpocock/retro
    mode: adapted
    phase: review
    purpose: Identify bounded improvements to agent navigation, checks, and engineering feedback.
    psdcConstraints: [no-unrequested-policy-change]
  - id: grill-me
    source: mattpocock-skills
    path: vendor/mattpocock/grill-me
    mode: adapted
    phase: specification
    purpose: Explore a user-requested idea without changing governed documents unless separately authorized.
    psdcConstraints: [human-authority-required]
  - id: grilling
    source: mattpocock-skills
    path: vendor/mattpocock/grilling
    mode: adapted
    phase: specification
    purpose: Reuse the interview mechanics behind unresolved decision discovery.
    psdcConstraints: [no-implicit-acceptance]
  - id: handoff
    source: mattpocock-skills
    path: vendor/mattpocock/handoff
    mode: adapted
    phase: review
    purpose: Preserve exact revisions, evidence, ownership, and next actions across agent or maintainer handoffs.
    psdcConstraints: [authority-links, evidence-state-required]
  - id: teach
    source: mattpocock-skills
    path: vendor/mattpocock/teach
    mode: adapted
    phase: education
    purpose: Develop club-member understanding without turning lessons into normative system decisions.
    psdcConstraints: [no-authority-transfer]
  - id: to-questionnaire
    source: mattpocock-skills
    path: vendor/mattpocock/to-questionnaire
    mode: adapted
    phase: governance
    purpose: Collect institution, legal, and operator decisions from the people who own them.
    psdcConstraints: [human-authority-required, no-unrequested-messages]
  - id: wait-what
    source: mattpocock-skills
    path: vendor/mattpocock/wait-what
    mode: adapted
    phase: education
    purpose: Restate confusing system explanations with the PSDC glossary and correct prerequisites.
    psdcConstraints: [glossary-terms-authoritative]
  - id: psdc-project-assessment
    source: psdc
    path: skills/psdc-project-assessment
    mode: enabled
    phase: specification
    purpose: Assess the ecosystem without confusing documentation with runtime proof.
    psdcConstraints: [all]
  - id: psdc-evidence-audit
    source: psdc
    path: skills/psdc-evidence-audit
    mode: enabled
    phase: specification
    purpose: Validate claim-to-artifact-to-revision evidence chains.
    psdcConstraints: [all]
  - id: psdc-upstream-adoption
    source: psdc
    path: skills/psdc-upstream-adoption
    mode: enabled
    phase: all
    purpose: Record reuse-versus-build decisions for every component and implementation delta.
    psdcConstraints: [upstream-provenance, license-gates, sovereign-authority, evidence-boundaries]

deferred:
  - id: ask-matt
    path: vendor/mattpocock/ask-matt
    activationGate: PSDC router must exclude gated implementation and external-write flows
  - id: triage
    path: vendor/mattpocock/triage
    activationGate: explicit issue-tracker mutation authority and PSDC issue-state mapping
  - id: diagnosing-bugs
    path: vendor/mattpocock/diagnosing-bugs
    activationGate: executable-system-exists
  - id: tdd
    path: vendor/mattpocock/tdd
    activationGate: approved-implementation-slice

prohibited:
  - id: implement
    path: vendor/mattpocock/implement
    reason: Documentation-first lifecycle does not authorize autonomous implementation.
  - id: implement-spec
    path: vendor/mattpocock/implement-spec
    reason: Approved specs require an explicit implementation instruction and handoff gate.

